name: Auto Build & Versioned Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Debug Keystore is present
        run: |
          if [ -f debug.keystore ]; then
            cp debug.keystore app/debug.keystore || true
          fi

      - name: Extract Version Name from build.gradle.kts
        id: extract_version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0")
          echo "Extracted version: $VERSION_NAME"
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: "Release v${{ env.APP_VERSION }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
